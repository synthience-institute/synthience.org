egulatory record of financial markets, and stating the conditions under which the argument would be wrong.",

// === STATE ===
var activeUpdateTag = "all";
var activeSort = "date";
var searchTerm = "";
var searchTimeout = null;

// === TAG FILTER ===
function getUpdateTags() {
  var tags = {};
  allUpdates.forEach(function(u) { tags[u.tag] = true; });
  return Object.keys(tags);
}

function renderUpdateTagButtons() {
  var existing = getUpdateTags();
  var container = document.getElementById("tag-filter");
  var html = '<span>Filter:</span>';
  html += '<button class="' + (activeUpdateTag === "all" ? "active" : "") + '" onclick="setUpdateTag(\'all\')">All</button>';
  existing.forEach(function(tag) {
    html += '<button class="' + (activeUpdateTag === tag ? "active" : "") + '" onclick="setUpdateTag(\'' + tag + '\')">' + tag + '</button>';
  });
  container.innerHTML = html;
}

function setUpdateTag(tag) {
  activeUpdateTag = tag;
  renderUpdateTagButtons();
  renderUpdates();
}

// === SORT CONTROLS ===
function renderSortButtons() {
  var container = document.getElementById("sort-controls");
  var html = '<span>Sort:</span>';
  html += '<button class="' + (activeSort === "date" ? "active" : "") + '" onclick="setSort(\'date\')">Date</button>';
  html += '<button class="' + (activeSort === "title" ? "active" : "") + '" onclick="setSort(\'title\')">Title</button>';
  container.innerHTML = html;
}

function setSort(by) {
  activeSort = by;
  renderSortButtons();
  renderUpdates();
}

// === SEARCH ===
function handleSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(function() {
    searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
    renderUpdates();
  }, 150);
}

// === SORT ===
// Matches the research-page convention: higher dateOrder displays earlier.
// Entries without dateOrder fall back to insertion order via stable sort.
function publicationDateSort(a, b) {
  var da = a.date ? new Date(a.date) : new Date(0);
  var db = b.date ? new Date(b.date) : new Date(0);
  if (db - da !== 0) return db - da;

  var oa = typeof a.dateOrder === "number" ? a.dateOrder : 0;
  var ob = typeof b.dateOrder === "number" ? b.dateOrder : 0;
  return ob - oa;
}

function titleSort(a, b) {
  // Strip leading "ID:" prefix (e.g. "PG-000: ", "FN-007: ", "SF0004: ", "SI-WP-010: ")
  // so the alphabetical sort goes by the actual title text rather than by the ID.
  // Titles without a clear ID prefix (e.g. "TCAP Published on Zenodo") are sorted as-is.
  var idColonPrefix = /^[A-Z]+(-[A-Z]+)?-?\d+[A-Za-z\-]*:\s*/;
  var ta = a.title.replace(idColonPrefix, "").toLowerCase();
  var tb = b.title.replace(idColonPrefix, "").toLowerCase();
  return ta.localeCompare(tb);
}

// === RENDERING ===
function renderUpdates() {
  var filtered = allUpdates.slice();

  if (activeUpdateTag !== "all") {
    filtered = filtered.filter(function(u) { return u.tag === activeUpdateTag; });
  }

  if (searchTerm) {
    filtered = filtered.filter(function(u) {
      return u.title.toLowerCase().indexOf(searchTerm) !== -1
        || u.body.toLowerCase().indexOf(searchTerm) !== -1
        || u.tag.toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  filtered.sort(activeSort === "title" ? titleSort : publicationDateSort);

  var container = document.getElementById("update-list");

  if (filtered.length === 0) {
    container.innerHTML = '<li class="empty-state">No updates match the selected filters.</li>';
    return;
  }

  var html = "";
  filtered.forEach(function(u) {
    var titleHtml = u.link
      ? '<a href="' + u.link + '">' + u.title + '</a>'
      : u.title;
    var actionHtml = u.actionLink
      ? ' <a href="' + u.actionLink + '">' + u.action + ' &rarr;</a>'
      : '';
    html += '<li>'
      + '<div class="update-date">' + u.dateDisplay + '</div>'
      + '<div class="update-title">' + titleHtml + '</div>'
      + '<div class="update-body">'
      + '<span class="update-tag">' + u.tag + '</span>'
      + u.body + actionHtml
      + '</div>'
      + '</li>';
  });
  container.innerHTML = html;
}

// === INIT ===
renderUpdateTagButtons();
renderSortButtons();
renderUpdates();
</script>
